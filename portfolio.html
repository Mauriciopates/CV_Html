<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio Técnico | Maurício Souza Pates</title>
    <meta name="description" content="Projetos de Maurício Souza Pates em Python, bases de dados MySQL e desenvolvimento web.">
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="img/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          document.documentElement.setAttribute('data-theme', saved || 'dark');
          var lang = localStorage.getItem('lang') || 'pt';
          document.documentElement.setAttribute('lang', lang === 'pt' ? 'pt-PT' : 'en');
        } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
      })();
    </script>
</head>

<body>

    <nav class="nav">
        <a href="index.html" class="nav-logo">
            <span class="logo-mark">mp</span>
            <span class="logo-text">maurício pates</span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html" data-i18n="nav.profile">Perfil</a></li>
            <li><a href="portfolio.html" class="active" data-i18n="nav.portfolio">Portfólio</a></li>
            <li><a href="terminal.html" data-i18n="nav.terminal">Terminal</a></li>
            <li><a href="contacto.html" data-i18n="nav.contact">Contacto</a></li>
        </ul>
        <div class="nav-actions">
            <div class="lang-switch" role="group" aria-label="Idioma">
                <button class="lang active" data-lang="pt">PT</button>
                <button class="lang" data-lang="en">EN</button>
            </div>
            <button id="themeToggle" class="theme-toggle" data-i18n-aria="nav.theme.aria" aria-label="Alternar tema">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
                </svg>
                <span id="themeLabel" data-i18n="nav.theme.dark">Escuro</span>
            </button>
        </div>
    </nav>

    <main class="container my-5">
        <section id="portfolio" class="mb-5">
            <div class="card shadow-sm border-0 p-4">
                <h1 class="h3 text-primary border-bottom pb-2 mb-3" data-i18n="portfolio.title">Meu Portfólio Técnico</h1>
                <p class="text-muted mb-3" data-i18n="portfolio.filter.hint">Filtre os projetos pelas tecnologias utilizadas abaixo:</p>

                <div class="d-flex gap-2 mb-4 flex-wrap">
                    <button class="btn btn-outline-primary btn-filter active" data-filter="all" data-i18n="portfolio.filter.all">Todos</button>
                    <button class="btn btn-outline-primary btn-filter" data-filter="Python">Python</button>
                    <button class="btn btn-outline-primary btn-filter" data-filter="Web" data-i18n="portfolio.filter.web">Web (HTML/CSS/JS)</button>
                    <button class="btn btn-outline-primary btn-filter" data-filter="Java">Java</button>
                </div>

                <div id="portfolio-container" class="row g-3"></div>
            </div>
        </section>
    </main>

    <div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content bg-white">
                <div class="modal-header">
                    <h5 class="modal-title text-dark" id="imageModalLabel">Diagrama</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <img id="imageModalImg" src="" alt="" class="img-fluid">
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-inner">
            <span>© 2026 Maurício Souza Pates</span>
            <span class="footer-mono" data-i18n="footer.made">feito com HTML, CSS e JS puro</span>
        </div>
    </footer>

    <script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>

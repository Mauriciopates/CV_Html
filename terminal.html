<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terminal — Maurício Pates</title>
<meta name="description" content="Terminal interativo do portfólio de Maurício Pates.">
<link rel="icon" href="img/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
  (function () {
    try {
      var saved = localStorage.getItem('theme');
      var theme = saved || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      var lang = localStorage.getItem('lang') || 'pt';
      document.documentElement.setAttribute('lang', lang === 'pt' ? 'pt-PT' : 'en');
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
</head>
<body>

<main id="app" class="app">

  <nav class="nav">
    <a href="index.html" class="nav-logo">
      <span class="logo-mark">mp</span>
      <span class="logo-text">maurício pates</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html" data-i18n="nav.profile">Perfil</a></li>
      <li><a href="portfolio.html" data-i18n="nav.portfolio">Portfólio</a></li>
      <li><a href="terminal.html" class="active" data-i18n="nav.terminal">Terminal</a></li>
      <li><a href="contacto.html" data-i18n="nav.contact">Contacto</a></li>
    </ul>
    <div class="nav-actions">
      <div class="lang-switch" role="group" aria-label="Idioma">
        <button class="lang active" data-lang="pt">PT</button>
        <button class="lang" data-lang="en">EN</button>
      </div>
      <button id="themeToggle" class="theme-toggle" data-i18n-aria="nav.theme.aria" aria-label="Alternar tema">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
        <span id="themeLabel" data-i18n="nav.theme.dark">Escuro</span>
      </button>
    </div>
  </nav>

  <section class="terminal-page">
    <header class="terminal-page-head">
      <span class="section-tag" data-i18n="terminal.tag">// terminal</span>
      <h1 data-i18n="terminal.title">Terminal interativo</h1>
      <p class="section-sub" data-i18n-html="terminal.sub">Escreve <code>help</code> para ver comandos. Usa <code>↑</code> para histórico, <code>Tab</code> para autocompletar.</p>
    </header>

    <div class="terminal-window">
      <div class="terminal-bar">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
        <span class="terminal-title">mauricio@portfolio — zsh</span>
      </div>
      <div class="terminal-body" id="terminalBody" aria-label="Terminal interativo"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="footer-inner">
      <span>© 2026 Maurício Souza Pates</span>
      <span class="footer-mono" data-i18n="footer.made">feito com HTML, CSS e JS puro</span>
    </div>
  </footer>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="script.js"></script>
</body>
</html>
